# Doodle Studio 3D: automatic tests on every pull request (and on main).
# Nothing here publishes or installs anything: builds still go out only through publish.js.
#  - mcp-and-package: MCP survival check (port, endpoint, tools, update probe, bad calls) + packaged file paths
#  - suites: every test suite, split over three machines (suites share fixed ports, so each machine runs one at a time)
#  - packaged-smoke: the packaged app in the real Electron runtime, driven through its MCP
# Suites that need the Doodle Library are skipped here (it is your own content and not in this public
# repo); run them on the PC with DSL_LIBRARY set: node tools/run_tests.cjs
name: Doodle Studio 3D tests

on:
  pull_request:
    paths: ['doodle-studio-3d/source/**', '.github/workflows/doodle-studio-3d-tests.yml']
  push:
    branches: [main]
    paths: ['doodle-studio-3d/source/**', '.github/workflows/doodle-studio-3d-tests.yml']
  workflow_dispatch:

concurrency:
  group: ds3d-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: doodle-studio-3d/source

jobs:
  mcp-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: MCP survival check
        run: node tools/run_tests.cjs --only=mcp_survival,package,update_safety,palettes

  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # Blender 4.5's Python, with bpy standing in for Blender (the app supports 4.5 and 5.0)
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: '.github/workflows/doodle-studio-3d-tests.yml' }
      - name: Install bpy, ffmpeg and Playwright
        run: |
          python -m pip install 'bpy==4.5.*'
          # ffmpeg for audio; EGL/GL (Mesa) so bpy can render on a machine with no GPU
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg libegl1 libgl1 libgl1-mesa-dri
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Test suites (shard ${{ matrix.shard }})
        env:
          DS3D_BPY: python
        run: node tools/run_tests.cjs --shard=${{ matrix.shard }} --json=results.json
      - name: Blender logs of failed renders
        if: failure()
        run: find devout -name blender.log -newer tools/run_tests.cjs -exec sh -c 'echo "== $1"; tail -n 25 "$1"' _ {} \; 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-results-${{ strategy.job-index }}
          path: doodle-studio-3d/source/results.json
          if-no-files-found: ignore

  packaged-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install the app's Electron runtime
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb
          RUNTIME=$(node -p "require('../manifest.json').runtime")
          mkdir -p /tmp/electron && cd /tmp/electron && npm init -y >/dev/null && npm install --no-save electron@$RUNTIME
      - name: Packaged smoke test
        env:
          ELECTRON: /tmp/electron/node_modules/electron/dist/electron
        run: node tools/run_tests.cjs --only=packaged --verbose
