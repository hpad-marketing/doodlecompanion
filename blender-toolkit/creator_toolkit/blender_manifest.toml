schema_version = "1.0.0"

id = "creator_toolkit"
version = "1.1.2"
name = "Creator Toolkit"
tagline = "Assets, looks, rigs, motion, camera and delivery in one place"
maintainer = "HPAD Marketing"
type = "add-on"
website = "https://github.com/hpad-marketing/doodlecompanion"

tags = ["Animation", "Rigging", "Material", "Render", "3D View"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]
